services:
  solver:
    build:
      context: .
      dockerfile: Dockerfile.solver
    ports:
      - "8000:8000"
    environment:
      - OSRM_BASE_URL=http://router.project-osrm.org

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://laravel:secret@postgres:5432/laravel?schema=public
      - ROUTING_SOLVER_URL=http://solver:8000
    depends_on:
      - solver
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
